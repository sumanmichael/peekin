[project]
name = "peekin"
dynamic = ["version"]
description = "Lightweight read-only file browser and previewer in your web browser"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*"]
requires-python = ">=3.10"
authors = [{ name = "Suman Michael" }]
keywords = ["file browser", "file viewer", "gallery", "pdf", "syntax highlighting"]
classifiers = [
    "Environment :: Web Environment",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment :: File Managers",
]
dependencies = [
    "starlette>=0.40",
    "uvicorn>=0.30",
    "pygments>=2.17",
    "markdown-it-py>=3",
]

[project.optional-dependencies]
thumbs = ["pillow>=10"]

[project.scripts]
peekin = "peekin.cli:main"

[project.urls]
Homepage = "https://github.com/sumanmichael/peekin"

[dependency-groups]
dev = [
    "pytest>=8",
    "pillow>=10",
    "httpx2>=2.13",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/peekin/__init__.py"
